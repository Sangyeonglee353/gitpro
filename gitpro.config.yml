# ═══════════════════════════════════════════
# 🎮 gitpro - All-in-One GitHub Profile Suite
# ═══════════════════════════════════════════
# 이 파일 하나로 모든 모듈을 제어합니다.
# 원하는 모듈만 enabled: true 로 설정하세요!

# 기본 설정
username: "Sangyeonglee353"
timezone: "Asia/Seoul"
locale: "ko"                    # ko | en | ja
theme: "dark"                   # dark | light | cyberpunk | retro | pastel | ocean | forest | dracula | nord | sunset | custom
include_private: true           # true: public + private 레포 포함 / false: public만

# ═══════════════════════════════════════════
# 🎨 커스텀 테마 (theme: "custom" 설정 시에만 적용)
# ═══════════════════════════════════════════

# custom_theme:
#   background: "#1a1b26"
#   backgroundSecondary: "#24283b"
#   text: "#c0caf5"
#   textSecondary: "#565f89"
#   accent: "#7aa2f7"
#   accentSecondary: "#bb9af7"
#   border: "#3b4261"

# ═══════════════════════════════════════════
# 🎯 모듈 설정
# ═══════════════════════════════════════════

modules:

  # 🃏 개발자 트레이딩 카드
  trading-card:
    enabled: true
    style: "hologram"           # hologram | pixel | minimal | anime
    show_ability: true
    show_skills: true
    max_skills: 5
    custom_title: ""            # 비워두면 자동 생성

  # 🧬 코드 DNA
  code-dna:
    enabled: true
    shape: "circular"           # circular | helix | spiral | fingerprint
    color_scheme: "language"    # language | mood | rainbow | monochrome
    complexity: "detailed"      # simple | detailed

  # 📜 개발자 연대기
  chronicle:
    enabled: true
    max_chapters: 8
    style: "rpg"                # rpg | book | timeline | comic
    language: "ko"              # 연대기 텍스트 언어

  # 🐾 코드 펫
  code-pet:
    enabled: true
    custom_name: ""             # 비워두면 자동 생성
    show_mood: true
    show_stats: true
    animation: true

  # 🌌 커밋 별자리
  constellation:
    enabled: true
    sky_theme: "midnight"       # midnight | aurora | sunset | deep_space
    show_meteors: true
    show_nebula: true
    max_constellations: 10

  # 🏙️ 개발자 도시
  dev-city:
    enabled: true
    city_style: "tycoon"      # tycoon | simcity | neon
    show_weather: true
    show_traffic: true
    animation: true

# ═══════════════════════════════════════════
# 📄 프로필 README 자동 생성 설정
# ═══════════════════════════════════════════

readme:
  auto_update: true
  layout: "grid"                # grid | vertical | tabs
  header:
    type: "wave"                # wave | typing | gradient | none
    text: "Hello, I'm Sangyeonglee353! 👋"
    color: "#6C63FF"
  footer:
    enabled: true
    style: "minimal"            # wave | minimal | stats | none
    text: ""                    # 추가 푸터 텍스트 (선택)
  module_order: []              # 모듈 표시 순서 (빈 배열이면 기본 순서)
                                # 예: ["trading-card", "code-pet", "code-dna"]
  show_last_updated: true       # 마지막 업데이트 시간 표시


