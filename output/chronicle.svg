<svg xmlns="http://www.w3.org/2000/svg" width="520" height="770" viewBox="0 0 520 770">
  <defs>
    <linearGradient id="chrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="chrAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="chrGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chrShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <linearGradient id="rankS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="rankA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="rankB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="rankC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45B7D1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#45B7D1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="rankD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96CEB4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#96CEB4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .chr-text { font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; }
    .chr-title { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .chr-subtitle { font-size: 11px; font-weight: 500; }
    .chr-chapter-title { font-size: 12px; font-weight: 700; }
    .chr-chapter-sub { font-size: 10px; font-weight: 500; }
    .chr-date { font-size: 9px; font-weight: 400; }
    .chr-desc { font-size: 9px; }
    .chr-rank { font-size: 11px; font-weight: 800; letter-spacing: 1px; }
    .chr-label { font-size: 9px; font-weight: 600; letter-spacing: 1px; }
    .chr-value { font-size: 10px; font-weight: 700; }
    .chr-small { font-size: 8px; }

    @keyframes chr-fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes chr-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes chr-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }
    .chr-chapter { animation: chr-fadeIn 0.5s ease-out forwards; opacity: 0; }
    .chr-quest-pulse { animation: chr-pulse 2s ease-in-out infinite; }
    .chr-rank-glow { animation: chr-glow 3s ease-in-out infinite; }
  </style>

  <!-- 배경 -->
  <rect width="520" height="770" rx="16" fill="url(#chrBg)"/>

  <!-- 장식: 좌측 세로선 (퀘스트 로그 느낌) -->
  <line x1="50" y1="100" x2="50" y2="644"
        stroke="url(#chrAccent)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- 헤더 -->
  
  <text x="260" y="30" text-anchor="middle" class="chr-text chr-title" fill="#58a6ff">
    📜 개발자 연대기</text>
  <text x="260" y="48" text-anchor="middle" class="chr-text chr-subtitle" fill="#e6edf3">
