    <radialGradient id="dnaGlow" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#3572A5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3572A5" stop-opacity="0"/>
    </radialGradient>
    <filter id="dnaShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="dnaBlur">
      <feGaussianBlur stdDeviation="3" result="blur"/>
